<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0c1524"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f15e42"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.04"/>
  <defs>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Decorative hexagon left -->
  <polygon points="80,200 160,155 240,200 240,290 160,335 80,290" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.25"/>
  <polygon points="95,208 160,170 225,208 225,282 160,320 95,282" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.15"/>

  <!-- Decorative hexagon right -->
  <polygon points="1040,100 1120,55 1200,100 1200,190 1120,235 1040,190" fill="none" stroke="#f15e42" stroke-width="1.5" opacity="0.2"/>
  <polygon points="960,380 1040,335 1120,380 1120,470 1040,515 960,470" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.15"/>

  <!-- Left orange accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="url(#accent)"/>

  <!-- Badge emblem circle -->
  <circle cx="160" cy="245" r="72" fill="#f59e0b" opacity="0.08"/>
  <circle cx="160" cy="245" r="58" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.4"/>
  <polygon points="160,190 200,212 200,278 160,300 120,278 120,212" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.6"/>
  <text x="160" y="242" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#f59e0b">SMK</text>
  <text x="160" y="262" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#fbbf24" letter-spacing="2">NEGERI 1</text>

  <!-- Ministry label -->
  <rect x="280" y="145" width="360" height="26" rx="13" fill="#f59e0b" opacity="0.12"/>
  <rect x="280" y="145" width="360" height="26" rx="13" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.4"/>
  <text x="460" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#f59e0b" letter-spacing="3">KEMENTERIAN PENDIDIKAN NASIONAL R.I.</text>

  <!-- School name -->
  <text x="280" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" fill="white" letter-spacing="3">SMKN 1 WONOGIRI</text>

  <!-- Tagline gradient text -->
  <text x="280" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="900" fill="url(#gold)">Center of Excellence</text>

  <!-- Sub tagline -->
  <text x="280" y="335" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="1">FOR BUSINESS  ·  CULINARY  ·  FASHION  ·  DIGITAL INNOVATION</text>

  <!-- Divider line -->
  <rect x="280" y="360" width="640" height="1" fill="url(#accent)" opacity="0.5"/>

  <!-- Description -->
  <text x="280" y="392" font-family="Arial, sans-serif" font-size="15" fill="#cbd5e1" letter-spacing="0.3">Membangun Generasi Profesional, Berkarakter, dan Siap Menghadapi Dunia Global</text>
  <text x="280" y="414" font-family="Arial, sans-serif" font-size="15" fill="#cbd5e1" letter-spacing="0.3">dengan kurikulum mutakhir berbasis industri modern.</text>

  <!-- Stats row -->
  <text x="280" y="470" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#f59e0b">50+</text>
  <text x="280" y="490" font-family="Arial, sans-serif" font-size="11" fill="#64748b" letter-spacing="1">MITRA INDUSTRI</text>

  <text x="430" y="470" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#f59e0b">500+</text>
  <text x="430" y="490" font-family="Arial, sans-serif" font-size="11" fill="#64748b" letter-spacing="1">SISWA AKTIF</text>

  <text x="590" y="470" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#f59e0b">90%+</text>
  <text x="590" y="490" font-family="Arial, sans-serif" font-size="11" fill="#64748b" letter-spacing="1">TERSERAP KERJA</text>

  <!-- Terakreditasi badge -->
  <rect x="280" y="520" width="200" height="36" rx="8" fill="#f59e0b" opacity="0.12" stroke="#f59e0b" stroke-width="1" opacity2="0.4"/>
  <text x="380" y="543" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#f59e0b" letter-spacing="2">TERAKREDITASI UNGGUL</text>

  <!-- URL -->
  <text x="920" y="570" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#475569" letter-spacing="1">smkn1wonogiri.sch.id</text>

  <!-- Bottom right decorative dots -->
  <circle cx="1100" cy="580" r="3" fill="#f59e0b" opacity="0.4"/>
  <circle cx="1115" cy="580" r="3" fill="#f59e0b" opacity="0.25"/>
  <circle cx="1130" cy="580" r="3" fill="#f59e0b" opacity="0.15"/>
</svg>
