    <script>
      // Prevent TypeError from third-party wrappers trying to hook window.fetch
      (function() {
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return originalFetch; },
            set: function(val) { originalFetch = val; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("Unable to define fetch setter, falling back to window listener:", e);
        }
        
        // Intercept and suppress global uncaught errors for fetch setter issues
        window.addEventListener('error', function(event) {
          if (event.message && (
            event.message.indexOf('Cannot set property fetch') !== -1 ||
            event.message.indexOf('only a getter') !== -1
          )) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
      })();
